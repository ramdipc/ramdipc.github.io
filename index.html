<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramdi Kurniawan — HRGA, Legal &amp; IT</title>
<meta name="description" content="HRGA, Legal &amp; IT Lead @ Heris Group — 11+ tahun di IT support &amp; infrastruktur.">
<meta property="og:type" content="website">
<meta property="og:title" content="Ramdi Kurniawan — HRGA, Legal &amp; IT Lead">
<meta property="og:description" content="HRGA, Legal &amp; IT Lead @ Heris Group — 11+ tahun di IT support &amp; infrastruktur.">
<meta property="og:image" content="assets/photo.webp">
<meta name="theme-color" content="#161616">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#D9D9D6; --paper:#F7F7F5; --ink:#161616; --ink-2:#4B4B48; --mute:#80807B;
  --line:#E3E3DF; --panel:#232323; --panel-ink:#F2F2EF; --panel-mute:#A3A39E; --panel-line:#3A3A38;
  --chip:#FFFFFF; --live:#2FB36B; --shadow:0 18px 50px rgba(20,20,18,.10);
  --display:'Archivo','Arial Narrow',Arial,sans-serif; --body:'Manrope',Verdana,sans-serif; --mono:'JetBrains Mono','Courier New',monospace;
  --spring:cubic-bezier(.3,1.35,.5,1); --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E0E0D; --paper:#1A1A19; --ink:#F0F0ED; --ink-2:#B9B9B4; --mute:#8C8C86;
  --line:#2C2C2A; --panel:#F0F0ED; --panel-ink:#161616; --panel-mute:#5E5E58; --panel-line:#D6D6D1;
  --chip:#242423; --shadow:0 18px 50px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ground:#0E0E0D; --paper:#1A1A19; --ink:#F0F0ED; --ink-2:#B9B9B4; --mute:#8C8C86;
  --line:#2C2C2A; --panel:#F0F0ED; --panel-ink:#161616; --panel-mute:#5E5E58; --panel-line:#D6D6D1;
  --chip:#242423; --shadow:0 18px 50px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:clamp(16px,3vw,40px);padding-block:88px clamp(24px,3vw,40px);transition:background-color .4s}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(16px,2.4vw,28px)}
.sheet{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:clamp(22px,4vw,56px);position:relative;overflow:hidden;transition:background-color .4s}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{top:12px}

/* ---------- floating nav with sliding indicator ---------- */
.topnav{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;
  background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--line);box-shadow:0 10px 30px -12px rgba(0,0,0,.25);max-width:calc(100vw - 24px)}
.topnav .links{position:relative;display:flex;gap:2px}
.topnav .ind{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;background:var(--ink);transition:transform .5s var(--spring),width .5s var(--spring);pointer-events:none}
.topnav a{position:relative;z-index:1;display:flex;align-items:center;gap:7px;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink-2);transition:color .3s}
.topnav a:hover{color:var(--ink)}
.topnav a.active{color:var(--paper)}
.topnav a svg{width:17px;height:17px;display:none}
.theme-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:background .25s,transform .4s var(--spring)}
.theme-btn:hover{background:var(--line);color:var(--ink)}
.theme-btn:active{transform:rotate(-30deg) scale(.9)}
.theme-btn svg{width:18px;height:18px}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;min-height:48px;padding:6px 6px 6px 22px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;font-size:14.5px;text-decoration:none;border:1px solid var(--ink);cursor:pointer;overflow:hidden;isolation:isolate;
  transition:transform .25s var(--spring),box-shadow .35s,background-color .3s,color .3s;touch-action:manipulation}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,color-mix(in srgb,var(--paper) 28%,transparent) 50%,transparent 70%);transform:translateX(-130%);transition:transform .8s var(--ease)}
.btn:hover::before{transform:translateX(130%)}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -12px color-mix(in srgb,var(--ink) 70%,transparent)}
.btn:active{transform:translateY(0) scale(.97)}
.btn .ic{width:36px;height:36px;flex:none;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;transition:transform .45s var(--spring),background-color .3s,color .3s}
.btn .ic svg{width:14px;height:14px}
.btn:hover .ic{transform:rotate(45deg)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost .ic{background:var(--ink);color:var(--paper)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.ghost:hover .ic{background:var(--paper);color:var(--ink)}
.btn.sm{min-height:42px;font-size:13.5px;padding-left:18px}
.btn.sm .ic{width:30px;height:30px}

/* ---------- hero ---------- */
.hero{padding-bottom:0}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:9px;background:var(--chip);border:1px solid var(--line);padding:9px 15px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);position:relative}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--live);opacity:.35;animation:ping 2s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.9);opacity:0}}
.name{font-family:var(--display);font-weight:800;font-stretch:112%;letter-spacing:.02em;line-height:.9;font-size:clamp(46px,11.2vw,138px);margin:clamp(28px,5vw,64px) 0 0;display:flex;flex-wrap:wrap;column-gap:.22em}
.name .w{display:inline-flex}
.name .o{color:transparent;-webkit-text-stroke:2px var(--ink)}
.name .ch{display:inline-block;animation:rise .8s var(--spring) both;animation-delay:calc(var(--i) * 35ms)}
@keyframes rise{from{transform:translateY(.35em);opacity:.0001}to{transform:none;opacity:1}}
.hero-grid{display:grid;grid-template-columns:1fr minmax(230px,390px) 1fr;align-items:end;gap:24px;margin-top:calc(-1 * clamp(14px,4.4vw,56px))}
.intro{padding-bottom:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:16px;max-width:36ch}
.intro h2{font-family:var(--display);font-weight:600;font-stretch:100%;font-size:clamp(22px,2.4vw,28px);margin:0;line-height:1.15;text-wrap:balance}
.sub{display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:600;color:var(--ink-2)}
.intro p{margin:0;color:var(--ink-2);font-size:15px}
.portrait{align-self:end;display:block;width:100%;height:auto;max-width:100%;filter:saturate(.9) contrast(1.03);transition:transform .8s var(--ease)}
.hero:hover .portrait{transform:translateY(-4px)}
.socials{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-bottom:clamp(24px,4vw,48px)}
.pill{display:inline-flex;align-items:center;gap:9px;min-height:40px;background:var(--chip);border:1px solid var(--line);padding:0 16px 0 12px;border-radius:999px;font-size:13.5px;font-weight:500;text-decoration:none;transition:transform .3s var(--spring),border-color .25s,background-color .25s,color .25s}
.pill svg{width:16px;height:16px}
.pill .arr{width:12px;height:12px;opacity:.5;transition:transform .35s var(--spring),opacity .25s}
.pill:hover{transform:translateX(-4px);border-color:var(--ink);background:var(--ink);color:var(--paper)}
.pill:hover .arr{transform:translate(2px,-2px);opacity:1}

/* ---------- section heads ---------- */
.wm{position:absolute;top:clamp(4px,1vw,14px);left:50%;transform:translateX(-50%);font-family:var(--display);font-weight:900;font-stretch:125%;font-size:clamp(56px,11vw,150px);line-height:1;letter-spacing:.06em;white-space:nowrap;pointer-events:none;opacity:.07;user-select:none}
.head{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:clamp(18px,3vw,40px)}
.head h2{margin:0;font-family:var(--display);font-weight:700;font-stretch:100%;font-size:clamp(28px,3.6vw,42px);letter-spacing:-.01em;line-height:1}
.head p{margin:0;font-size:14px}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

/* ---------- experience ---------- */
.dark{background:var(--panel);color:var(--panel-ink)}
.dark .wm{opacity:.06}
.exp{list-style:none;margin:clamp(24px,3vw,40px) 0 0;padding:0;border-top:1px solid var(--panel-line)}
.exp>li{border-bottom:1px solid var(--panel-line)}
.row-btn{width:100%;background:none;border:0;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto 40px;align-items:center;gap:16px;padding:22px 8px;border-radius:10px;transition:background-color .25s,padding .35s var(--ease)}
.row-btn:hover{background:color-mix(in srgb,var(--panel-ink) 5%,transparent);padding-left:16px}
.row-btn .co{font-weight:600;font-size:16px}
.row-btn .role{color:var(--panel-mute);font-size:15px;margin-top:3px}
.row-btn .when{font-family:var(--mono);font-size:13px;color:var(--panel-mute);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tog{width:40px;height:40px;border-radius:50%;border:1px solid var(--panel-line);display:grid;place-items:center;transition:transform .45s var(--spring),background-color .3s,color .3s}
.tog svg{width:14px;height:14px}
.row-btn[aria-expanded="true"] .tog{transform:rotate(45deg);background:var(--panel-ink);color:var(--panel)}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.acc.open{grid-template-rows:1fr}
.acc>div{overflow:hidden}
.acc .body{padding:0 8px 28px;display:grid;grid-template-columns:1fr 1fr;gap:18px 40px;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .45s var(--ease)}
.acc.open .body{opacity:1;transform:none;transition-delay:.08s}
.acc .body>p{margin:0;color:var(--panel-mute);max-width:60ch;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tag{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--panel-line);color:var(--panel-ink)}
.groups{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px 36px;padding-top:18px;border-top:1px dashed var(--panel-line)}
.grp h4{margin:0 0 10px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--panel-mute)}
.grp ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:14px;line-height:1.5;color:var(--panel-mute)}
.grp li b{color:var(--panel-ink);font-weight:600}

/* ---------- work + animated filter tabs ---------- */
.filters{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:clamp(22px,3vw,40px)}
.tabs{position:relative;display:inline-flex;gap:2px;padding:5px;border-radius:999px;background:var(--chip);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--ink);transition:transform .5s var(--spring),width .5s var(--spring)}
.tabs button{position:relative;z-index:1;border:0;background:none;cursor:pointer;min-height:38px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:color .3s}
.tabs button[aria-selected="true"]{color:var(--paper)}
.tabs button .n{font-family:var(--mono);font-size:11px;opacity:.6;margin-left:6px}
.count{font-family:var(--mono);font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,28px);margin-top:22px}
.card{background:var(--chip);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .4s var(--spring),box-shadow .4s,opacity .25s;transform-origin:center}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -22px rgba(0,0,0,.35)}
.card.out{opacity:0;transform:scale(.96)}
.card.in{animation:cardIn .55s var(--spring) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.screen{aspect-ratio:16/9;max-width:100%;background:#1E1E1D;position:relative;overflow:hidden;padding:18px;display:flex;flex-direction:column;gap:8px}
.screen .bar{display:flex;gap:6px;margin-bottom:4px}
.screen .bar i{width:8px;height:8px;border-radius:50%;background:#454543}
.screen .big{position:absolute;right:-6px;bottom:-18px;font-family:var(--display);font-weight:900;font-stretch:125%;font-size:clamp(70px,10vw,130px);line-height:1;color:transparent;-webkit-text-stroke:1.5px #4A4A47;transition:transform .6s var(--ease),-webkit-text-stroke-color .4s}
.card:hover .big{transform:translate(-8px,-6px);-webkit-text-stroke-color:#8A8A85}
.screen .r{height:10px;border-radius:3px;background:#343432;transition:width .6s var(--ease)}
.screen .r.a{background:#E9E9E4}
.card-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
.card h3{margin:0;font-weight:600;font-size:clamp(18px,1.8vw,21px);line-height:1.3}
.card p{margin:0;color:var(--ink-2);font-size:14.5px}
.card .tags .tag{border-color:var(--line);color:var(--ink-2);background:var(--paper)}
.card .go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.card .go svg{width:13px;height:13px;transition:transform .35s var(--spring)}
.card:hover .go svg{transform:rotate(45deg)}

/* ---------- skills ---------- */
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:clamp(22px,3vw,40px);border-top:1px solid var(--line)}
.skill{padding:22px 20px 6px;display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line);transition:background-color .3s}
.skill:first-child{border-left:0;padding-left:0}
.skill h3{margin:0;font-size:16px;font-weight:700}
.skill ul{margin:0;padding:0;list-style:none;color:var(--ink-2);font-size:14.5px;display:flex;flex-direction:column;gap:6px}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;align-items:end}
.contact h2{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(38px,6.6vw,86px);line-height:.95;margin:0 0 28px;text-wrap:balance}
.contact h2 .o{color:transparent;-webkit-text-stroke:2px var(--ink)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.contact dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:14px 20px;font-size:15px}
.contact dt{color:var(--mute);font-family:var(--mono);font-size:12px;padding-top:3px}
.contact dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--chip);border-radius:999px;min-height:30px;padding:0 10px;font-size:12px;cursor:pointer;transition:background-color .2s,transform .25s var(--spring)}
.copy:hover{background:var(--line)}
.copy:active{transform:scale(.94)}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--mute);padding:4px 6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .45s var(--spring);z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr 1fr}
  .portrait{grid-column:1 / -1;grid-row:1;width:min(320px,100%);justify-self:center}
  .socials{align-items:flex-start;flex-direction:row;flex-wrap:wrap;grid-column:1 / -1}
  .intro{grid-column:1 / -1;padding-bottom:0;max-width:none}
  .skills{grid-template-columns:repeat(2,minmax(0,1fr))}
  .skill:nth-child(3){border-left:0;padding-left:0}
  .contact{grid-template-columns:1fr}
}
@media (max-width:720px){
  body{padding-block:20px calc(env(safe-area-inset-bottom,0px) + 100px)}
  .topnav{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:5px}
  .topnav a{flex-direction:column;gap:2px;min-height:50px;padding:0 10px;font-size:10.5px;justify-content:center}
  .topnav a svg{display:block}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
  html{scroll-padding-top:16px}
}
@media (max-width:620px){
  .grid{grid-template-columns:1fr}
  .row-btn{grid-template-columns:1fr 40px}
  .row-btn .when{grid-column:1;grid-row:2;text-align:left}
  .row-btn .tog{grid-column:2;grid-row:1 / span 2}
  .acc .body{grid-template-columns:1fr}
  .skills{grid-template-columns:1fr}
  .skill,.skill:nth-child(3){border-left:0;padding-left:0}
}
@media (max-width:380px){ .topnav a{padding:0 7px} .sep{display:none} }
.pv .name .ch{animation:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>


<a class="skip" href="#main">Lewati ke konten</a>

<nav class="topnav" aria-label="Navigasi utama">
  <div class="links" id="navlinks">
    <span class="ind" aria-hidden="true"></span>
    <a href="#beranda" data-s="beranda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Beranda</a>
    <a href="#pengalaman" data-s="pengalaman"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>Pengalaman</a>
    <a href="#karya" data-s="karya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Karya</a>
    <a href="#keahlian" data-s="keahlian"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>Keahlian</a>
    <a href="#kontak" data-s="kontak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Kontak</a>
  </div>

    var cards=[].slice.call($('grid').children), shown=0;
    var show=function(c){return filter==='all'||c.dataset.k===filter};
    if(!animate){cards.forEach(function(c){c.hidden=!show(c);if(!c.hidden)shown++});}
    else{
      cards.forEach(function(c){if(!c.hidden&&!show(c))c.classList.add('out')});
      setTimeout(function(){var i=0;cards.forEach(function(c){c.classList.remove('out','in');c.hidden=!show(c);if(!c.hidden){shown++;c.style.setProperty('--i',i++);void c.offsetWidth;c.classList.add('in')}});
        $('count').textContent=shown+' proyek'},200);
      return;
    }
    $('count').textContent=shown+' proyek';
  }

  document.addEventListener('click',function(e){
    var t=e.target.closest('[role="tab"]');
    if(t&&t.dataset.f){filter=t.dataset.f;[].forEach.call(t.parentNode.querySelectorAll('[role="tab"]'),function(b){b.setAttribute('aria-selected',b===t)});moveInd(t.parentNode,t);applyFilter(true);return;}
    var r=e.target.closest('.row-btn');
    if(r){var open=r.getAttribute('aria-expanded')!=='true';r.setAttribute('aria-expanded',open);document.getElementById(r.getAttribute('aria-controls')).classList.toggle('open',open);return;}
    var cp=e.target.closest('[data-copy]');
    if(cp){var v=cp.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast('Disalin: '+v)},function(){toast(v)});}
  });
  var tt;function toast(m){var el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show')},2400)}

  /* scrollspy + nav indicator */
  var navBox=$('navlinks'), navLinks=[].slice.call(navBox.querySelectorAll('a'));
  function setActive(id){navLinks.forEach(function(a){a.classList.toggle('active',a.dataset.s===id);if(a.dataset.s===id){a.setAttribute('aria-current','true');moveInd(navBox,a)}else a.removeAttribute('aria-current')})}
  function spy(){var best='beranda',y=innerHeight*0.35;navLinks.forEach(function(a){var s=document.getElementById(a.dataset.s);if(s&&s.getBoundingClientRect().top<=y)best=a.dataset.s});
    if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)best='kontak';setActive(best)}
  var ticking=false;addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(function(){spy();ticking=false})}},{passive:true});
  addEventListener('resize',function(){spy();moveInd($('tabs'),$('tabs').querySelector('[aria-selected="true"]'))});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){spy();moveInd($('tabs'),$('tabs').querySelector('[aria-selected="true"]'))});

  /* theme toggle */
  var root=document.documentElement;
  try{var saved=localStorage.getItem('rk-theme');if(saved)root.dataset.theme=saved}catch(e){}
  $('themeBtn').addEventListener('click',function(){
    var cur=root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var next=cur==='dark'?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('rk-theme',next)}catch(e){}
  });

  /* data: seed first if remote is slow, then live content.json */
  var seed={};try{seed=JSON.parse($('seed').textContent)}catch(e){}
  var isPreview=/[?&]preview=1/.test(location.search), done=false;
  function go(d){done=true;render(d)}
  if(isPreview){
    addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.type==='rk-preview'){photoOverride=e.data.photoUrl||null;render(e.data.content)}});
    go(seed); try{parent.postMessage({type:'rk-ready'},location.origin)}catch(e){}
  }else{
    var timer=setTimeout(function(){if(!done)go(seed)},1500);
    fetch('data/content.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){clearTimeout(timer);go(d)}).catch(function(){clearTimeout(timer);if(!done)go(seed)});
  }
})();
</script>
